server:
  port: 8708

# 模型库 / 数据集上传存储根目录（相对项目运行目录）
# 磁盘结构：
#   uploads/library/models/{id目录}/   模型文件
#   uploads/library/datasets/{id目录}/ 数据集文件
# MySQL 只存元数据（名称、归属人、大小、时间、fl_key 等），真正文件在上述目录。
library:
  storage-root: uploads/library
  # 联邦服务器下载时使用的 Web 地址。请改成这台电脑的局域网 IP，不要用 localhost。
  # 留空则依次使用 device.join-base-url，或自动探测 192.168 网卡。
  public-base-url:

# 联邦学习远程项目目录（102 上）——全部走独立 pig_project，绝不调用论文 asyn / 原 sync_fl
# async-workdir：异步 + 生猪专项
# sync-workdir：同步经典算法
federated:
  server-host: 192.168.124.102
  server-user: hzauaiot3
  server-password: 12345678
  project-root: /home/hzauaiot3/lzh/pig_project
  async-workdir: /home/hzauaiot3/lzh/pig_project/async
  sync-workdir: /home/hzauaiot3/lzh/pig_project/sync
  sync-port: 8810

mqtt:
  # 本机未启动 Mosquitto 时请保持 false，否则会持续 Connection refused 刷屏
  # 真机/设备心跳联调时再改为 true
  enabled: false
  broker-url: tcp://localhost:1883
  client-id-prefix: springboot-mqtt-client
  status-topic: jetson/device/status
  train-topic-prefix: jetson/train/
  strategy-topic-prefix: jetson/device/strategy/
  plant-cmd-topic-prefix: plant/cmd/
  plant-telemetry-topic: plant/telemetry/#
  plant-ack-topic: plant/ack/#
  completion-timeout: 5000
  recovery-interval: 5000
  connection-timeout: 10
  keep-alive-interval: 20

# 未来植物原型系统
plant:
  default-device-key: plant-ctrl-01
  # 真机 MQTT 联调时改为 true；本地/演示保持 false，避免无 Broker 时刷屏
  mqtt:
    enabled: false
  # 默认实机：不自动造假遥测/假抓拍；本地无设备时可在看板手动开 Mock，或设 plant.mock.enabled=true
  mock:
    enabled: false
    interval-ms: 5000
  media-dir: uploads/plant
  export-max-rows: 100000
  # 同事设备网关（如 192.168.123.103）。enabled=false 时只走本地库/Mock，不外呼
  gateway:
    camera:
      enabled: false
      base-url: http://192.168.123.103:8080/api/v1
      api-key: ""
      connect-timeout-ms: 3000
      read-timeout-ms: 15000
      default-move-duration-ms: 500
      # 定时拍照：轮询网关 last_file 并同步预览帧到本地媒体库
      schedule-sync-ms: 5000
    led:
      enabled: false
      base-url: http://192.168.123.103:8090/api/v1
      api-key: ""
      rack-key: led-rack-01
      connect-timeout-ms: 3000
      read-timeout-ms: 10000

device:
  offline-timeout-seconds: 30
  offline-check-interval-ms: 10000
  # 设备默认固定坐标（华中农业大学实验基地，未上报 GPS 时使用）
  default-latitude: 30.475800
  default-longitude: 114.353600
  default-location-name: 华中农业大学实验基地
  # 手机扫码用的公网/局域网访问地址（不要用 localhost，手机打不开）
  # 改成你电脑当前局域网 IP，例如 http://192.168.124.8:8707
  # 局域网地址请在 application-local.yml 覆盖
  join-base-url: http://127.0.0.1:8707
  # 网页新增板端设备后，自动 SSH 部署心跳脚本
  auto-deploy-heartbeat: true
  # 未登记设备的心跳是否自动入库（关闭可避免删除后又被心跳拉回）
  auto-register-on-heartbeat: false
  # 心跳脚本目录（相对项目根或绝对路径）
  heartbeat-script-dir: scripts/device-heartbeat
  # MQTT broker 候选地址（从设备侧依次探测可达性，兼容跨网段/VPN）
  heartbeat-broker-hosts: 127.0.0.1

robot:
  camera:
    port: 5000
    capture-path: /capture
    video-path: /video_feed
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    # 账号密码写在 application-local.yml
    username: CHANGE_ME
    password: CHANGE_ME
    basic-auth-enabled: false
