<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>员工更新子页面</title>
    <script src="../../js/jquery-3.4.1.min.js"></script>
    <script src="../../layui/layui.js"></script>
    <link rel="stylesheet" href="../../layui/css/layui.css">
</head>
<body>
<form class="layui-form" style="margin-top: 20px">
    <div class="layui-form-item" style="padding-right: 50px;">
        <label class="layui-form-label">交通ID</label>
        <div class="layui-input-block">
            <input id="employee-name" type="text" name="name" required  lay-verify="required" placeholder="请输入交通ID, 如: 1" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form" style="padding-right: 50px">
        <label class="layui-form-label">交通类型</label>
        <div class="layui-input-block">
            <input id="employee-type" type="text" name="name" required  lay-verify="required" placeholder="请输入类型, 如: 1" autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item" style="padding-right: 50px">
        <label class="layui-form-label">调度类型</label>
        <div class="layui-input-block">
            <input id="employee-address" type="text" name="name" required  lay-verify="required" placeholder="调度类型，如30|SECOND" autocomplete="off" class="layui-input">
        </div>
    </div>


    <div class="layui-form-item" style="padding-right: 30px; width: 300px; margin: 0 auto; margin-top: 15px">
        <div class="layui-input-block">
            <button class="layui-btn" lay-submit lay-filter="formDemo" id="submit-btn">提交</button>
            <button id="reset" type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </div>
</form>

<script>
    var layerCallback;  // 子页面回调函数
    // 父页面传过来的信息
    var positionsIdAndName = [];
    var departmentsIdAndName = [];
    // 全局函数, 父页面向子页面传值
    function child(data) {
        positionsIdAndName = data.positions;
        departmentsIdAndName = data.departments;
        // 完成后, 回调, 进行渲染
        selectorAppend();
        /*for (var i = 0; i < data.positions.length; i++) {
            console.log(data.positions[i]);
        }
        for (var i = 0; i < data.departments.length; i++) {
            console.log(data.departments[i]);
        }*/
    }
    function selectorAppend() {
        /*进行下拉框动态拼接*/
        console.log(positionsIdAndName);
        for (var i = 0; i < positionsIdAndName.length; i++) {
            $("#position-select").append('<option value=' + positionsIdAndName[i].id + '>' + positionsIdAndName[i].name + '</option>');
        }
        for (var i = 0; i < departmentsIdAndName.length; i++) {
            $("#department-select").append('<option value=' + departmentsIdAndName[i].id + '>' + departmentsIdAndName[i].name + '</option>');
        }


        layui.use('form', function(){
            //监听提交
            $("#submit-btn").click(function () {
                var nowDate = new Date();
                var railId = $("#employee-name").val();
                var railType = $("#employee-type").val();
                var schedulingPeriod = $("#employee-address").val();

                var ajaxData = {
                    railId: railId,
                    railType: railType,
                    schedulingPeriod: schedulingPeriod

                };

                $.ajax({
                    url: '/demo/first',
                    async: false,
                    method: 'get',
                    data: ajaxData,
                    success: function (res) {
                        if (res.code == 200) {
                            // 回调主界面
                            parent.layerCallback(ajaxData);
                            parent.layer.msg('添加维修任务成功', {icon: 1});
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(index);
                        } else {
                            parent.layer.msg('添加任务失败', {icon: 2});
                        }
                        return false;
                    }
                });
            });
        });
    }



</script>
</body>
</html>
